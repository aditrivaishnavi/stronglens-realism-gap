[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stronglens-realism-gap"
version = "0.2.0"
description = "Linear-probe diagnostics of observed and source-injected strong-lens images in DESI Legacy Imaging Surveys DR10"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Aditrivaishnavi Balaji", email = "aditrivaishnavi@gmail.com"},
]
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy>=1.26.4",
    "pandas>=2.1.4",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.9.0,<1.10",
    "scipy>=1.12.0",
    "healpy>=1.16.0",
    "astropy>=5.0",
    "galsim==2.8.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "lenstronomy>=1.11.0",
    "pytest>=8.0",
    "ruff>=0.16",
]
s3 = ["boto3>=1.34.0"]

[project.urls]
Repository = "https://github.com/aditrivaishnavi/stronglens-realism-gap"

[tool.setuptools.packages.find]
include = ["dhs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring optional scientific packages or external data",
    "slow: tests with many simulation or resampling draws",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/test_injection_engine.py" = ["F401", "E741"]
