source_construction:
  source_pixel_scale_arcsec: 0.03
  stamp_size_pixels: 161
  reconstruction_psf_fwhm_arcsec: 0.15
  reconstruction_psf_must_exceed_original_fwhm: true
  native_inscribed_radius_fraction_for_eligibility: 0.95
  maximum_common_working_support_radius_arcsec: 2.35
  minimum_positive_flux_retained_in_common_support: 0.90
  maximum_structured_negative_to_positive_flux: 0.20
  maximum_sersic_negative_to_positive_flux: 0.001
  centroid_target: geometric_grid_center
  centroid_separation_tolerance_arcsec: 0.0003
  nonnegative_projection: >-
    clip_negative_values_after_common_0.15arcsec_lowpass_before_unit_integral_normalization
  support_treatment: >-
    both_arms_zeroed_outside_each_sources_95percent_measured_native_inscribed_radius_capped_at_2.35arcsec
  normalization: unit_discrete_source_plane_integral_after_declared_projection
  structured_profile: >-
    GalSim RealGalaxy deconvolution of the observed COSMOS F814W stamp,
    reconvolved to a common 0.15 arcsec reconstruction PSF. It retains
    measurement uncertainty and is not latent truth.
  twin_profile: >-
    Catalogue single-Sersic n, circularized half-light radius, axis ratio and
    position angle, convolved to the identical reconstruction PSF.

