claim:
  primary: >-
    For the frozen score-blind subset of registered G_rec parent scenes and the
    declared high-S/N F814W empirical-source subset, estimate the
    photon-averaged change in fixed-detector threshold response when the
    0.15-arcsec-regularized GalSim-deconvolved empirical construction is
    replaced by its deterministic single-Sersic twin, holding each parent
    scene's host, lens, source position, effective-Gaussian PSF identity and
    intrinsic g/r/z flux fixed. For each empirical source, both arms use the
    same circular mask equal to 95% of that source's measured native inscribed
    support radius, capped at 2.35 arcsec, retain at least 90% of
    pre-projection positive map flux, and
    include a declared nonnegative projection whose pre-projection
    negative-to-positive flux is at most 0.20. This is a conditional
    fixed-cutout source-construction functional, not latent morphology.
  construction_label: >-
    measured_native_common_support_truncated_nonnegative_high_sn_regularized_galsim_deconvolved_f814w
  prohibited:
    - latent multiband source
    - noise-free COSMOS morphology
    - pure morphology effect
    - chromatic morphology result
    - source morphology equivalence
    - survey completeness
    - exposure-level recovery

