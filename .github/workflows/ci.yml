name: repository checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check dhs scripts tests experiments_v2 evaluation_dataset_prep

      - name: Test root and experiment packages
        run: make test-all PYTHON="uv run python"

      - name: Verify public evidence and submission documents
        run: make verify PYTHON="uv run python"

      - name: Validate manifests
        run: make validate PYTHON="uv run python"
