[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stronglens-psrc-v2"
version = "0.2.0"
description = "Score-blind paired source-construction experiment preparation"
requires-python = "==3.12.*"
dependencies = [
  "astropy==8.0.1",
  "galsim==2.8.5",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "PyYAML==6.0.3",
  "scipy==1.18.1",
  "torch==2.7.0",
  "torchvision==0.22.0",
]

[project.optional-dependencies]
test = [
  "lenstronomy==1.14.1",
  "pytest==9.1.1",
]

[project.scripts]
psrc-v2 = "psrc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
