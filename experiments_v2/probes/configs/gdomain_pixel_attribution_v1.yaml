    - z_max
  analyses:
    - full_model_reproduction
    - univariate_crossfit
    - leave_one_feature_out
    - single_band
    - leave_one_band_out
    - fold_standardized_coefficients
  forbidden:
    - global_scaling
    - outcome_dependent_folds
    - row_bootstrap
    - permutation_p_values
