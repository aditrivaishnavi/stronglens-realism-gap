[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grec-renderer-reconciliation-v1"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "grec-pnoise",
  "lenstronomy==1.14.1",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "scipy==1.18.1",
  "torch==2.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.sources]
grec-pnoise = { path = "../grec_pnoise", editable = true }
