[study]
study_id = "stronglens_gmatch_v2_final_preparation"
status = "adopted_execution_authority_pre_feature"
authority_basis = "Declared score-blind G_match preparation protocol"
scope = "score_blind_final_preparation_only"
data_role = "final"

[paths]
repository_root = "."
output_root = "results_v2/canonical_test_host_repair_v1/gmatch/preparation"
reference_payload_root = "evaluation_dataset_prep/candidate_payloads"

[matching]
candidate_population = "exact_final_grec_hosts"
covariates = [
  "observed_zmag",
  "sersic_n",
  "axis_ratio_q",
  "psf_fwhm_r_arcsec",
  "depth5_r_mag",
]
centre = "median"
scale = "interquartile_range"
scaling_population = "exact_final_grec_hosts_only"
scaler_value_policy = "component_wise_all_finite_values_exact_authorized_roster"
scaler_authority_rows = 4500
candidate_eligibility = "all_five_covariates_finite"
missing_covariate_policy = "retain_in_scaler_authority_accounting_mark_ineligible_no_imputation"
imputation = false
expected_complete_matching_candidates = 4500
expected_nonfinite_observed_zmag_hosts = 0
prior_scaler_comparator = "complete_case_4265_hosts_non_governing"
distance = "robust_diagonal_euclidean"
component_caliper_standardised = 2.0
total_distance_caliper = 3.0
targets_per_reference = 1
replacement = false
assignment = "maximum_cardinality_then_minimum_distance"
tie_rule = "sha256_sorted_identifiers"
unmatched_references = "retain_with_disposition"
minimum_matched_references_for_future_five_fold_analysis = 10
contract_version = "score_blind_robust_iqr_optimal_v2"
host_total_flux_floor = "forbidden"

[matching.expected_scaler.observed_zmag]
finite = 4500
missing = 0
median = 19.39710237176541
iqr = 1.0567950650698492

[matching.expected_scaler.sersic_n]
finite = 4500
missing = 0
median = 2.5997047424316406
iqr = 3.0

[matching.expected_scaler.axis_ratio_q]
finite = 4500
missing = 0
median = 0.6087695572740404
iqr = 0.34962079133933555

[matching.expected_scaler.psf_fwhm_r_arcsec]
finite = 4500
missing = 0
median = 1.3872898653320314
iqr = 0.31376147270202637

[matching.expected_scaler.depth5_r_mag]
finite = 4500
missing = 0
median = 24.295993050549264
iqr = 0.41633649881539725

[schema_policy]
mode = "strict_context_specific_allowlists"
unknown_columns = "reject"
missing_columns = "reject"
duplicate_columns = "reject"
forbidden_aliases = [
  "feature_vector",
  "stein_embedding",
  "final_response",
  "cnn_output",
  "detector_prob",
  "pred",
  "score",
  "scores",
  "cnn_score",
  "detector_score",
  "logit",
  "logits",
  "prob",
  "probability",
  "probabilities",
  "prediction",
  "predictions",
  "oof",
  "oof_score",
  "auc",
  "decision",
  "detection",
  "detector_output",
  "feature",
  "features",
  "embedding",
  "embeddings",
  "representation",
  "representations",
  "response",
]

[pairing]
theta_e_arcsec = 1.5
scene_rule = "exact_radius_then_lexicographic_grec_row_id"
arms = ["bare", "injected"]
rows_per_matched_target = 2
source_flux_policy = "fixed_intrinsic"
rendering = "zero_copy_exact_parent_bytes"
bare_array_key = "cutout"
bare_layout = "HWC"
injected_array_key = "expectation_chw"
injected_layout = "CHW"
pixel_dtype = "float32"
pixel_shape_hwc = [101, 101, 3]
pixel_shape_chw = [3, 101, 101]

[execution]
overwrite_frozen_artifacts = false
detector_scores_forbidden = true
detector_outcomes_forbidden = true
feature_extraction_forbidden = true
probe_fitting_forbidden = true
bootstrap_forbidden = true
network_allowed = false
stop_before_feature_authorization = true

