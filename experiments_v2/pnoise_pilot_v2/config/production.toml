[study]
study_id = "stronglens_pnoise_design_pilot_v2"
status = "adopted_execution_authority_pre_pilot"
authority_basis = "Declared source-photon draw-count design protocol"
scope = "design_role_only_no_final_outcomes"
predecessor_artifacts_created_under_successor = false

[paths]
repository_root = "."
historical_root = "data/downloads"
predecessor_package_src = "experiments_v2/grec_pnoise/src"
output_root = "results_v2/pnoise/design_pilot"
candidate_payload_root = "evaluation_dataset_prep/candidate_payloads"

[design]
global_role = "design"
source_population = "historical_v1_val_full_validation_negatives"
selection_namespace = "stronglens-pnoise-design-host-selection-v2"
hosts_per_cell = 32
expected_cells = 9
expected_hosts = 288
radii_arcsec = [0.50, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00]
expected_scenes = 3168
supported_cells = [
  "1.05|24.5",
  "1.20|24.0",
  "1.20|24.5",
  "1.35|24.0",
  "1.35|24.5",
  "1.50|24.0",
  "1.50|24.5",
  "1.65|24.0",
  "1.65|24.5",
]
one_host_per_physical_group = true
one_host_per_historical_spatial_component = true
selection_uses_detector_outputs = false

[overlap]
required_id_overlap = 0
required_pixel_overlap = 0
required_physical_group_overlap = 0
required_canonical_spatial_component_overlap = 0
required_healpix_128_overlap = 0
required_within_38_arcsec_pairs = 0
minimum_angular_separation_arcsec = 38.0
comparison_roles = ["G_rec_final", "threshold_calibration", "achieved_fpr"]

[historical_source]
s3_bucket = "darkhaloscope"
s3_prefix = "stronglens_calibration/"
aws_profile_default = "avb"
raw_host_array = "cutout"
historical_expectation_array = "injected"
historical_source_array = "injection_only"
historical_member_template = "./{inj_id}.npz"
required_split = "val"
required_label = 0
required_shape_hwc = [101, 101, 3]
pixel_scale_arcsec = 0.262
host_pixel_unit = "nanomaggy_per_native_pixel"
host_flux_calibration_system = "AB_nanomaggy_zeropoint_22.5"
ancestry_gate = "exact_float32(raw_host_chw + historical_injection_only) == historical_injected"

[pilot]
maximum_draw_count = 64
candidate_draw_counts = [2, 4, 8, 16, 32, 64]
diagnostic_nonselectable_draw_counts = [1]
batch_size = 64
filler_policy = "last"
authoritative_device = "mps"
pixel_persistence = "none_stream_batches_only"
score_artifact = "pilot_scores.npz"
score_receipt = "PILOT_SCORE_RECEIPT.json"
photon_draw_key_encoding = "20_raw_digest_bytes_for_photon_<40_hex>"

[pnoise]
gain_electron_per_nanomaggy_g = 150.0
gain_electron_per_nanomaggy_r = 150.0
gain_electron_per_nanomaggy_z = 150.0
photon_stream_namespace = "stronglens-pnoise-photon-v1"
added_sky_noise = false
existing_host_sky_detector_coadd_noise_redrawn = false
law = "Poisson(source_expectation_nmgy * gain) / gain"

[inference]
metric = "equal_cell_equal_host_after_radius_and_draw_average_paired_detection_risk_difference"
mcse_absolute_max = 0.002
mcse_fraction_of_sampling_se_max = 0.20
sampling_se = "nine_cell_stratified_standard_error_of_64_draw_host_effects"
mcse = "independent_scene_draw_variance_propagated_through_equal_host_radius_weights"
one_draw_mcse_status = "unavailable_by_inference_contract"

[handoff]
production_expected_metric = "host_equal_paired_detection_risk_difference"
production_expected_status = "pnoise_design_mcse_draw_count_frozen"
validator = "grec_pnoise.pnoise.validate_draw_count_receipt"

[scoring]
checkpoint = "data/downloads/models/primary_seed42_epoch160.pt"
checkpoint_sha256 = "5d1082839aac7a0bfb89342f84a9a533b22e1111c15cb4711255ed1b524a2b8d"
checkpoint_epoch = 160
checkpoint_architecture = "efficientnet_v2_s"
threshold_float32_bits = 1070149163
comparison = ">="
native_logit_dtype = "float32"
authoritative_backend_profile_sha256 = "88964e2a54b09317d7c4e5a7a0909a4be7ec9cbd7499988d19adaaca2fb77b87"
authoritative_scorer_closure_sha256 = "de81bc834c0d8517e096b40bdc8ed828d18449ed3a571ef6291fa18c17c34f97"

[execution]
tests_required_before_freeze = true
design_freeze_required_before_pilot = true
overwrite_frozen_artifacts = false
feature_extraction_forbidden = true
final_pnoise_rendering_forbidden = true
final_grec_outcome_access_forbidden = true
network_allowed_during_pilot = false

[validation]
test_suite_id = "pnoise_pilot_v2_prelaunch_contracts_v2"
expected_test_cardinality = 51
require_zero_skips = true
comparison_pixel_hash_workers = 8
expected_nodeids_path = "experiments_v2/pnoise_pilot_v2/tests/EXPECTED_NODEIDS.json"
