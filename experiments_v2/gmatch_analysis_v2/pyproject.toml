[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "gmatch-analysis-v2"
version = "0.1.0"
description = "Hash-bound final G_match analysis-only execution"
requires-python = "==3.12.13"
dependencies = [
  "joblib==1.6.0",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "stronglens-probes",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.1"]

[project.scripts]
gmatch-analysis-v2 = "gmatch_analysis_v2.pipeline:main"
gmatch-analysis-v2-verify = "gmatch_analysis_v2.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
stronglens-probes = { path = "../probes", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
