checkpoint_architecture = "efficientnet_v2_s"
batch_size = 64
filler_policy = "last"
comparison = ">="
native_logit_dtype = "float32"
required_threshold_receipt_status = "common_threshold_frozen"
authoritative_device = "mps"
deterministic_algorithms = true
cudnn_deterministic = true
cudnn_benchmark = false
float32_matmul_precision = "highest"

[scoring.mps_environment]
PYTORCH_ENABLE_MPS_FALLBACK = "0"
PYTORCH_MPS_FAST_MATH = "0"
PYTORCH_MPS_PREFER_METAL = "0"

[scoring.runtime_versions]
