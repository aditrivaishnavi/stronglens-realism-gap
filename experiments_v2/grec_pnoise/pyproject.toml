[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grec-pnoise"
version = "0.4.0"
description = "Fail-closed G_rec and P_noise preparation pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "torch==2.7.0",
  "torchvision==0.22.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
grec-pnoise = "grec_pnoise.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
